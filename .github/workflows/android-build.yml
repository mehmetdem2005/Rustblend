name: RUSTBLEND Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustblend-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: Run Rust unit tests
        run: cargo test --locked

      - name: Build and package APK
        run: bash scripts/build-android-apk.sh

      - name: Upload installable APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: RUSTBLEND-Android-APK-${{ github.run_number }}
          path: build/android-apk/RUSTBLEND.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record successful build for automatic artifact retrieval
        if: success()
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload-apk.outputs.artifact-id }}
        with:
          script: |
            const path = "CI_BUILD_STATUS.json";
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error("GitHub did not return a valid APK artifact ID.");
            }

            const body = {
              status: "success",
              run_id: context.runId,
              run_number: context.runNumber,
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              source_commit: context.sha,
              artifact_id: artifactId,
              artifact_name: `RUSTBLEND-Android-APK-${context.runNumber}`,
              apk_file: "RUSTBLEND.apk",
              retention_days: 14
            };

            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                ...context.repo,
                path,
                ref: "main"
              });
              if (Array.isArray(existing.data) || !existing.data.sha) {
                throw new Error("CI build status path is not a regular file.");
              }
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              message: `ci: record successful Android build ${context.runNumber}`,
              content: Buffer.from(JSON.stringify(body, null, 2) + "\n").toString("base64"),
              branch: "main",
              ...(sha ? { sha } : {})
            });
